<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mubasshir Mart</title>
  <link href="https://fonts.googleapis.com/css2?family=Cookie&family=Corinthia:wght@400;700&family=Engagement&family=Luxurious+Script&family=Pacifico&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <div class="container">
      <div class="logo">Mubasshir Mart</div>
      <nav id="bar">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Products</a></li>
          <li><a href="#">Deals</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <input class="search-bar" type="text" placeholder="Search...">
    </div>
  </header>

  <section class="banner">
    <h2>Welcome to Mubasshir Mart</h2>
    <p>Shop your favorite items at unbeatable prices!</p>
  </section>

  <section class="featured">
    <h3>Featured Products</h3>
    <div class="product-grid">
      <div class="product-card">
        <img src="mobile.jpg" alt="Poco C71">
        <h4>Poco C71</h4>
        <p>₹7000</p>
        <button>Add to Cart</button>
        <button class="buy">Buy Now</button>
      </div>
      <div class="product-card">
        <img src="earbuds.jpg" alt="Product 2">
        <h4>Boat Bluetooth Headphones</h4>
        <p>₹300</p>
        <button>Add to Cart</button>
        <button class="buy">Buy Now</button>
      </div>
      <div class="product-card">
        <img src="bag.jpg" alt="Product 3">
        <h4>Skybags</h4>
        <p>₹600</p>
        <button>Add to Cart</button>
        <button class="buy">Buy Now</button>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Mubasshir Mart. All rights reserved.</p>
  </footer>

</body>
</html>
